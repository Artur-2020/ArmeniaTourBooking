services:
  tour-service:
    build: .
    volumes:
      - .:/app
    ports:
      - '${LOCAL_PORT}:${PORT}'
    environment:
      - RABBITMQ_URL=${RABBITMQ_URL}
    command: sh -c "npm install && npm run start:dev"
    networks:
      - services_microservices-network

networks:
  services_microservices-network:
    external: true 