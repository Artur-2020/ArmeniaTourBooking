services:
  api-service:
    build: .
    volumes:
      - .:/app
    ports:
      - '${LOCAL_PORT}:${PORT}'
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - RABBITMQ_URL=${RABBITMQ_URL}
    depends_on:
      - api-db
    command: sh -c "npm install && npm run start:dev"
    networks:
      - services_microservices-network

  api-db:
    image: postgres:13
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: api_db
    ports:
      - "${DB_LOCAL_PORT}:5432"
    volumes:
      - api_db_data:/var/lib/postgresql/data
    networks:
      - services_microservices-network
networks:
  services_microservices-network:
    external: true

volumes:
  api_db_data: